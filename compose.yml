services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dna_futsal
      POSTGRES_USER: dna_futsal
      POSTGRES_PASSWORD: dna_futsal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dna_futsal -d dna_futsal"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dna_futsal
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
