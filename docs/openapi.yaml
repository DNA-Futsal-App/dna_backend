openapi: 3.1.0
info:
  title: DNA Futsal API
  version: 0.1.0
  description: API pública e autenticada do aplicativo DNA Futsal.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Events
  - name: Sports
  - name: News
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra uma conta pendente de confirmação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cadastro criado e e-mail enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/email-verification/confirm:
    get:
      tags: [Auth]
      summary: Confirma o e-mail com token de uso único
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: E-mail confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      summary: Reenvia a confirmação de uma conta pendente
      description: Resposta genérica; considera no máximo três links de confirmação por usuário/dia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: E-mail ou telefone, maxLength: 254 }
      responses:
        '202':
          description: Solicitação processada sem revelar a existência da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Entra com e-mail ou telefone e senha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens e perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoga um refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Sessão revogada ou já inexistente }
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicita link para redefinir senha
      description: Sempre responde de forma genérica. O limite é de três solicitações por usuário/dia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, maxLength: 254 }
      responses:
        '202':
          description: Solicitação processada sem revelar a existência do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Define nova senha com token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 200 }
                newPassword: { type: string, minLength: 10, maxLength: 72 }
      responses:
        '200':
          description: Senha alterada e sessões revogadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/me:
    get:
      tags: [Profile]
      summary: Retorna o perfil autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Profile]
      summary: Substitui os dados do perfil após validar a senha atual
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado. Se o e-mail mudou, emailVerified será false e as sessões serão revogadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/public/catalog/divisions:
    get:
      tags: [ Catalog ]
      summary: Lista as divisões do Campeonato Paulista
      parameters:
        - in: query
          name: season
          required: true
          schema:
            type: integer
            minimum: 2016
            maximum: 2100
      responses:
        '200':
          description: Divisões disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/public/catalog/categories:
    get:
      tags: [ Catalog ]
      summary: Lista categorias de uma divisão do Campeonato Paulista
      parameters:
        - in: query
          name: season
          required: true
          schema:
            type: integer
            minimum: 2016
            maximum: 2100

        - in: query
          name: divisionId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Categorias disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/public/events:
    get:
      tags: [Events]
      summary: Pesquisa competições no scraper
      parameters:
        - in: query
          name: season
          required: true
          schema: { type: integer, minimum: 2016, maximum: 2100 }
        - in: query
          name: division
          schema: { type: string, maxLength: 100 }
        - in: query
          name: category
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Competições encontradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SportsEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/public/events/{eventId}:
    get:
      tags: [Events]
      summary: Retorna uma competição
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: Competição encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportsEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/public/events/{eventId}/teams:
    get:
      tags: [Events]
      summary: Lista as equipes da competição
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: Equipes participantes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/matches/played:
    get:
      tags: [Sports]
      summary: Lista jogos encerrados
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalEventId' }
        - { $ref: '#/components/parameters/OptionalTeamId' }
        - { $ref: '#/components/parameters/OptionalPhase' }
        - { $ref: '#/components/parameters/OptionalFrom' }
        - { $ref: '#/components/parameters/OptionalTo' }
      responses:
        '200':
          description: Partidas encerradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/matches/upcoming:
    get:
      tags: [Sports]
      summary: Lista jogos futuros
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalEventId' }
        - { $ref: '#/components/parameters/OptionalTeamId' }
        - { $ref: '#/components/parameters/OptionalPhase' }
        - { $ref: '#/components/parameters/OptionalFrom' }
        - { $ref: '#/components/parameters/OptionalTo' }
      responses:
        '200':
          description: Partidas futuras
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/standings:
    get:
      tags: [Sports]
      summary: Retorna classificação
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalEventId' }
        - { $ref: '#/components/parameters/OptionalTeamId' }
        - { $ref: '#/components/parameters/OptionalPhase' }
        - in: query
          name: group
          schema: { type: string, maxLength: 150 }
      responses:
        '200':
          description: Classificação
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Standing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/top-scorers:
    get:
      tags: [Sports]
      summary: Retorna artilharia
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalEventId' }
        - { $ref: '#/components/parameters/OptionalTeamId' }
        - { $ref: '#/components/parameters/OptionalPhase' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Artilharia
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopScorer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v1/news:
    get:
      tags: [News]
      summary: Lista notícias publicadas
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de notícias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsPage' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/news/{slug}:
    get:
      tags: [News]
      summary: Retorna uma notícia pelo slug
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      responses:
        '200':
          description: Notícia completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsArticle' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Identificador usado para correlacionar a resposta com os logs do backend.
      schema: { type: string, minLength: 8, maxLength: 64 }
  parameters:
    EventId:
      in: path
      name: eventId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    OptionalEventId:
      in: query
      name: eventId
      description: Quando omitido, usa a preferência do perfil.
      schema: { type: integer, format: int64, minimum: 1 }
    OptionalTeamId:
      in: query
      name: teamId
      description: Quando omitido, usa a preferência do perfil.
      schema: { type: string, maxLength: 100 }
    OptionalPhase:
      in: query
      name: phase
      schema: { type: string, maxLength: 150 }
    OptionalFrom:
      in: query
      name: from
      schema: { type: string, format: date }
    OptionalTo:
      in: query
      name: to
      schema: { type: string, format: date }
  responses:
    BadRequest:
      description: Requisição inválida
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Não autenticado ou credencial inválida
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Conta ainda não confirmada ou bloqueada
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: E-mail ou telefone já cadastrado
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite temporário atingido
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Integração externa indisponível
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: A integração externa retornou dados inválidos
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      description: A integração externa excedeu o tempo limite
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, example: '(11) 98765-4321' }
        password: { type: string, format: password, minLength: 10, maxLength: 72 }
        childInstagram: { type: [string, 'null'], example: '@atleta' }
        eventId: { type: [integer, 'null'], format: int64, minimum: 1 }
        categoryId: { type: [string, 'null'], maxLength: 100 }
        divisionId: { type: [string, 'null'], maxLength: 100 }
        teamId: { type: [string, 'null'], maxLength: 100 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: E-mail ou telefone }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 200 }
    AuthResponse:
      type: object
      required: [tokenType, accessToken, expiresIn, refreshToken, user]
      properties:
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string }
        expiresIn: { type: integer, format: int64, example: 900 }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/UserProfile' }
    UserProfile:
      type: object
      required: [id, name, email, phone, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, example: '+5511987654321' }
        childInstagram: { type: [string, 'null'] }
        eventId: { type: [integer, 'null'], format: int64 }
        categoryId: { type: [string, 'null'] }
        divisionId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      required: [name, email, phone, currentPassword]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30, example: '(11) 98765-4321' }
        childInstagram: { type: [string, 'null'], example: '@atleta' }
        eventId: { type: [integer, 'null'], format: int64, minimum: 1 }
        categoryId: { type: [string, 'null'], maxLength: 100 }
        divisionId: { type: [string, 'null'], maxLength: 100 }
        teamId: { type: [string, 'null'], maxLength: 100 }
        currentPassword: { type: string, format: password, maxLength: 72 }
    SportsEvent:
      type: object
      required: [eventId, title, season, category, division]
      properties:
        eventId: { type: integer, format: int64 }
        title: { type: string }
        season: { type: integer }
        category: { type: string }
        division: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'], format: uri }
    Match:
      type: object
      required: [id, eventId, competitionName, season, category, division, homeTeam, awayTeam, status, walkover]
      properties:
        id: { type: string }
        eventId: { type: integer, format: int64 }
        competitionName: { type: string }
        season: { type: integer }
        category: { type: string }
        division: { type: string }
        phase: { type: [string, 'null'] }
        homeTeam: { $ref: '#/components/schemas/Team' }
        awayTeam: { $ref: '#/components/schemas/Team' }
        homeScore: { type: [integer, 'null'] }
        awayScore: { type: [integer, 'null'] }
        scheduledAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [FINISHED, SCHEDULED] }
        walkover: { type: boolean }
        venue: { type: [string, 'null'] }
        matchSheetUrl: { type: [string, 'null'], format: uri }
    Standing:
      type: object
      required: [team]
      properties:
        phase: { type: [string, 'null'] }
        group: { type: [string, 'null'] }
        position: { type: [integer, 'null'] }
        team: { $ref: '#/components/schemas/Team' }
        played: { type: [integer, 'null'] }
        wins: { type: [integer, 'null'] }
        draws: { type: [integer, 'null'] }
        losses: { type: [integer, 'null'] }
        goalsFor: { type: [integer, 'null'] }
        goalsAgainst: { type: [integer, 'null'] }
        goalDifference: { type: [integer, 'null'] }
        points: { type: [integer, 'null'] }
        average: { type: [number, 'null'], format: double }
        goalsForAverage: { type: [number, 'null'], format: double }
        goalsAgainstAverage: { type: [number, 'null'], format: double }
        technicalIndex: { type: [number, 'null'], format: double }
    TopScorer:
      type: object
      required: [position, team, personalDataSuppressed]
      properties:
        position: { type: integer }
        phase: { type: [string, 'null'] }
        athleteName: { type: [string, 'null'] }
        athleteImageUrl: { type: [string, 'null'], format: uri }
        team: { $ref: '#/components/schemas/Team' }
        goals: { type: [integer, 'null'] }
        personalDataSuppressed: { type: boolean }
    NewsArticle:
      type: object
      required: [id, slug, title, publishedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        content: { type: [string, 'null'] }
        coverImageUrl: { type: [string, 'null'], format: uri }
        authorName: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
    NewsPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/NewsArticle' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Problem:
      type: object
      required: [title, status, detail, code, timestamp, requestId]
      properties:
